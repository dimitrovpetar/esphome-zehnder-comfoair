substitutions:
  friendly_name: Zehnder Q350
  device_name: zehnder-comfoair-q
  device_description: Zehnder Q350
  filter_time: 5s
  filter_send_every: "1"
  filter_window_size: "3"

packages:
  binary_sensors: !include binary_sensors.yml
  board: !include board.yml
  button: !include button.yml
  canbus: !include canbus.yml
  common: !include common.yml
  comfoair: !include zehnder_comfoair_q.yml
  fan: !include fan.yml
  project: !include project.yml
  select: !include select.yml
  sensors: !include sensors.yml
  switch: !include switch.yml
  text_sensors: !include text_sensors.yml

esphome:
  name: ${device_name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
#  comment: ${device_description}

debug:
  update_interval: 5s

logger:
  level: WARN
  logs:
    canbus: WARN
    
ota:
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_rrm: true
  enable_btm: true
  fast_connect: true

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: sorting_group_control
      name: "Control"
      sorting_weight: 1
    - id: sorting_group_boost
      name: "Boost"
      sorting_weight: 2
    - id: sorting_group_bypass
      name: "Bypass"
      sorting_weight: 3
    - id: sorting_group_humidity
      name: "Humidity"
      sorting_weight: 4
    - id: sorting_group_temperature
      name: "Temperature"
      sorting_weight: 5
    - id: sorting_group_energy
      name: "Energy"
      sorting_weight: 6
    - id: sorting_group_sensors
      name: "Sensors"
      sorting_weight: 7
    - id: sorting_group_wifi_module
      name: "WiFi Module"
      sorting_weight: 8
    - id: sorting_group_debug
      name: "Debug"
      sorting_weight: 9
  auth:
    username: !secret user
    password: !secret pass
